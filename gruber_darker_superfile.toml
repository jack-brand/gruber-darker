file_panel_item_selected_fg = "#ffdd33"
file_panel_item_selected_bg = "#181818"

#-- Footer
footer_fg = "#e4e4ef"
footer_bg = "#181818"
footer_border = "#3e4d46"
footer_border_active = "#95a99f"

#-- Sidebar
sidebar_fg = "#e4e4ef"
sidebar_bg = "#181818"
sidebar_title = "#96a6c8"
sidebar_border = "#181818"
sidebar_border_active = "#95a99f"
sidebar_item_selected_fg = "#ffdd33"
sidebar_item_selected_bg = "#181818"
