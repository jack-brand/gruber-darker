########################################################
#               Code Syntax Highlighting               #
########################################################

# Find one you like at:
# https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "algol_nu"

########################################################
#                     Base Colors                      #
########################################################

#-- Full Screen
full_screen_fg = "#e4e4ef"
full_screen_bg = "#181818"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#89b4fa", "#cba6f7"]
directory_icon_color = ""

#-- File Panel
file_panel_fg = "#e4e4ef"
file_panel_bg = "#181818"
file_panel_border = "#3e4d46"
file_panel_border_active = "#95a99f"
file_panel_top_directory_icon = "#96a6c8"
